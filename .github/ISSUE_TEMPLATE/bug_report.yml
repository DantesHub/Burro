name: Bug report
description: Report a reproducible problem in Burro.
body:
  - type: markdown
    attributes:
      value: Please use synthetic examples. Remove private chat titles, paths, hostnames, and credentials from screenshots and logs.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Burro version/commit, macOS version, Mac architecture, and provider app versions if relevant.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional screenshots or minimal synthetic fixtures. Do not upload provider databases or transcripts.
